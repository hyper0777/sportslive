[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  included_files = ["netlify/functions/**"]
  external_node_modules = ["@netlify/functions"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  port = 3000
  command = "npm run dev"
  functions = "netlify/functions"
  targetPort = 5173
